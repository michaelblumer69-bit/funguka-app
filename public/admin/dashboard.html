<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUNGUKA Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 20px; }
    h1 { color: #ff3366; margin-bottom: 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab { padding: 10px 20px; background: #1a1a1a; border: 1px solid #333; color: #888; cursor: pointer; border-radius: 6px; text-decoration: none; }
    .tab.active { background: #ff3366; color: white; border-color: #ff3366; }
    table { width: 100%; border-collapse: collapse; background: #111; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #222; }
    th { background: #1a1a1a; color: #ff3366; font-weight: 600; }
    tr:hover { background: #1a1a1a; }
    .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; margin-right: 4px; }
    .btn-delete { background: #cc0000; color: white; }
    .btn-hide { background: #666; color: white; }
    .btn-show { background: #00aa44; color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #1a1a1a; padding: 24px; border-radius: 12px; max-width: 400px; width: 90%; border: 1px solid #333; }
    .modal h3 { color: #ff3366; margin-bottom: 12px; }
    .modal p { color: #aaa; margin-bottom: 20px; line-height: 1.5; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-actions .btn { padding: 8px 16px; }
    .btn-cancel { background: #333; color: #ccc; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .stat-card { background: #111; padding: 16px; border-radius: 8px; border: 1px solid #222; }
    .stat-card h4 { color: #888; font-size: 12px; text-transform: uppercase; margin-bottom: 6px; }
    .stat-card .num { color: #ff3366; font-size: 24px; font-weight: bold; }
    .hidden-row { opacity: 0.4; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #00aa44; color: white; padding: 12px 20px; border-radius: 6px; display: none; z-index: 2000; }
    .toast.error { background: #cc0000; }
  </style>
</head>
<body>
  <h1>🛡️ FUNGUKA Admin Dashboard</h1>
  
  <div class="tabs">
    <a href="dashboard.html" class="tab active">📊 Dashboard</a>
    <a href="upload.html" class="tab">🎙️ Upload Audio</a>
  </div>

  <div class="stats" id="stats"></div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Category</th>
        <th>Plays</th>
        <th>Reactions</th>
        <th>Audio</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <tr><td colspan="8" style="text-align:center;padding:40px;color:#666;">Loading...</td></tr>
    </tbody>
  </table>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modal-title">Confirm</h3>
      <p id="modal-text">Are you sure?</p>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn btn-delete" id="modal-confirm-btn" onclick="executePending()">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const ADMIN_TOKEN = 'funguka-admin-2024';
    let confessions = [];
    let pending = null; // { type: 'delete'|'hide', id: number, btn: HTMLElement }

    async function api(url, opts = {}) {
      const res = await fetch(url, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          'x-admin-token': ADMIN_TOKEN,
          ...(opts.headers || {})
        }
      });
      if (!res.ok) {
        const text = await res.text().catch(() => 'Unknown error');
        throw new Error(text || `HTTP ${res.status}`);
      }
      return res.status === 204 ? null : res.json().catch(() => null);
    }

    async function loadData() {
      try {
        const data = await api('/api/confessions') || [];
confessions = Array.isArray(data) ? data : (data.confessions || []);
        render();
      } catch (e) {
        showToast('Failed to load: ' + e.message, true);
        document.getElementById('table-body').innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:#cc0000;">Error loading data</td></tr>`;
      }
    }

    function render() {
      const total = confessions.length;
      const hidden = confessions.filter(c => c.hidden).length;
      const totalPlays = confessions.reduce((s, c) => s + (c.plays || 0), 0);
      const totalReactions = confessions.reduce((s, c) => s + (c.reactions || 0), 0);

      document.getElementById('stats').innerHTML = `
        <div class="stat-card"><h4>Confessions</h4><div class="num">${total}</div></div>
        <div class="stat-card"><h4>Hidden</h4><div class="num">${hidden}</div></div>
        <div class="stat-card"><h4>Total Plays</h4><div class="num">${totalPlays}</div></div>
        <div class="stat-card"><h4>Total Reactions</h4><div class="num">${totalReactions}</div></div>
      `;

      const tbody = document.getElementById('table-body');
      if (!confessions.length) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:#666;">No confessions found</td></tr>`;
        return;
      }

      tbody.innerHTML = confessions.map(c => `
        <tr class="${c.hidden ? 'hidden-row' : ''}" data-id="${c.id}">
          <td>#${c.id}</td>
          <td>${escapeHtml(c.title)}</td>
          <td>${escapeHtml(c.category)}</td>
          <td>${c.plays || 0}</td>
          <td>${c.reactions || 0}</td>
          <td>${c.audio_url ? '🔊' : '—'}</td>
          <td>${c.hidden ? '🙈 Hidden' : '👁️ Visible'}</td>
          <td>
            ${c.hidden 
              ? `<button class="btn btn-show" onclick="toggleHide(${c.id}, this)">Show</button>` 
              : `<button class="btn btn-hide" onclick="toggleHide(${c.id}, this)">Hide</button>`}
            <button class="btn btn-delete" onclick="promptDelete(${c.id}, '${escapeHtml(c.title)}', this)">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    function promptDelete(id, title, btn) {
      pending = { type: 'delete', id, btn };
      document.getElementById('modal-title').textContent = '🗑️ Delete Confession';
      document.getElementById('modal-text').textContent = `Permanently delete "${title}"? This cannot be undone.`;
      document.getElementById('modal-confirm-btn').textContent = 'Delete';
      document.getElementById('modal-confirm-btn').className = 'btn btn-delete';
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      pending = null;
      document.getElementById('modal').style.display = 'none';
      const btn = document.getElementById('modal-confirm-btn');
      btn.innerHTML = 'Delete';
      btn.disabled = false;
    }

    async function executePending() {
      if (!pending) return;
      const { type, id, btn } = pending;
      const modalBtn = document.getElementById('modal-confirm-btn');
      modalBtn.innerHTML = '<span class="spinner"></span>';
      modalBtn.disabled = true;

      try {
        if (type === 'delete') {
          await api(`/api/confessions/${id}`, { method: 'DELETE' });
          showToast('Deleted successfully');
          confessions = confessions.filter(c => c.id !== id);
          render();
        }
        closeModal();
      } catch (e) {
        showToast('Error: ' + e.message, true);
        modalBtn.innerHTML = type === 'delete' ? 'Delete' : 'Confirm';
        modalBtn.disabled = false;
      }
    }

    async function toggleHide(id, btn) {
      const originalText = btn.textContent;
      btn.innerHTML = '<span class="spinner"></span>';
      btn.disabled = true;
      try {
        const c = confessions.find(x => x.id === id);
        const res = await api(`/api/confessions/${id}/hide`, {
          method: 'PATCH',
          body: JSON.stringify({ hidden: !c.hidden })
        });
        c.hidden = !c.hidden;
        render();
        showToast(c.hidden ? 'Hidden' : 'Visible');
      } catch (e) {
        showToast('Error: ' + e.message, true);
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }

    function showToast(msg, isError) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast' + (isError ? ' error' : '');
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    loadData();
  </script>
</body>
</html>
