<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUNGUKA Admin Dashboard</title>
<style>
:root {
  --black: #0a0a0a;
  --card: #111111;
  --card-hover: #161616;
  --border: #222222;
  --border-hover: #333333;
  --text: #ffffff;
  --text-muted: #888888;
  --text-dim: #555555;
  --pink: #FF006E;
  --pink-dim: #330011;
  --purple: #2D1B4E;
  --green: #00c853;
  --orange: #ff6400;
  --blue: #0096ff;
  --yellow: #ffc800;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--black);
  color: var(--text);
  padding: 30px 20px;
  max-width: 1200px;
  margin: 0 auto;
}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 26px;
  background: linear-gradient(90deg, #fff, var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header .subtitle { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
.nav-links { display: flex; gap: 12px; }
.nav-links a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 13px;
  padding: 8px 16px;
  border-radius: 10px;
  border: 1px solid var(--border);
  transition: all 0.2s;
}
.nav-links a:hover, .nav-links a.active {
  color: var(--pink);
  border-color: var(--pink);
  background: var(--pink-dim);
}

/* Stats */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 30px;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  text-align: center;
}
.stat-card .number {
  font-size: 32px;
  font-weight: 800;
  color: var(--pink);
  margin-bottom: 6px;
}
.stat-card .label {
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Table */
.table-container {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
}
.table-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}
.table-header h2 { font-size: 16px; }
.table-header .filter-btns {
  display: flex;
  gap: 8px;
}
.filter-btn {
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.filter-btn:hover, .filter-btn.active {
  background: var(--pink-dim);
  color: var(--pink);
  border-color: var(--pink);
}

.confession-row {
  display: grid;
  grid-template-columns: 50px 1fr 100px 80px 80px 120px;
  gap: 12px;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  transition: background 0.2s;
}
.confession-row:hover { background: var(--card-hover); }
.confession-row.hidden { opacity: 0.5; }
.confession-row .id {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 600;
}
.confession-row .title {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
}
.confession-row .title .preview {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 400;
  margin-top: 4px;
  line-height: 1.4;
}
.confession-row .cat {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 6px;
  text-align: center;
}
.cat.heartbreak { background: rgba(255,0,110,0.12); color: var(--pink); }
.cat.crime { background: rgba(255,100,0,0.12); color: var(--orange); }
.cat.dark { background: rgba(168,85,247,0.12); color: #a855f7; }
.cat.regret { background: rgba(0,150,255,0.12); color: var(--blue); }
.cat.wild { background: rgba(255,200,0,0.12); color: var(--yellow); }

.confession-row .stats {
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
}
.confession-row .audio {
  font-size: 12px;
  text-align: center;
}
.audio.has { color: var(--green); }
.audio.none { color: var(--text-dim); }

.confession-row .actions {
  display: flex;
  gap: 6px;
  justify-content: flex-end;
}
.btn-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: all 0.2s;
}
.btn-icon:hover { border-color: var(--pink); color: var(--pink); }
.btn-icon.delete:hover { border-color: #ff3333; color: #ff3333; background: rgba(255,51,51,0.1); }
.btn-icon.hide:hover { border-color: var(--orange); color: var(--orange); background: rgba(255,100,0,0.1); }
.btn-icon.show:hover { border-color: var(--green); color: var(--green); background: rgba(0,200,83,0.1); }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  margin-left: 8px;
}
.badge.hidden { background: var(--orange); color: #fff; }
.badge.flagged { background: var(--pink); color: #fff; }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}

.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 14px 20px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  z-index: 200;
  transition: all 0.3s;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.toast.success { border-color: var(--green); color: var(--green); }
.toast.error { border-color: var(--pink); color: var(--pink); }

.loading {
  text-align: center;
  padding: 40px;
  color: var(--text-muted);
}
.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--pink);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.confirm-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.8);
  z-index: 300;
  align-items: center;
  justify-content: center;
}
.confirm-modal.show { display: flex; }
.modal-content {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px;
  max-width: 400px;
  width: 90%;
  text-align: center;
}
.modal-content h3 { margin-bottom: 12px; }
.modal-content p { color: var(--text-muted); margin-bottom: 24px; font-size: 14px; }
.modal-btns { display: flex; gap: 12px; }
.modal-btns button {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}
.modal-btns .cancel {
  background: var(--card-hover);
  color: var(--text-muted);
  border: 1px solid var(--border);
}
.modal-btns .confirm {
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: #fff;
}
.modal-btns .confirm.delete { background: #ff3333; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🛡️ FUNGUKA Admin</h1>
    <div class="subtitle">Manage confessions, delete tests, hide content</div>
  </div>
  <div class="nav-links">
    <a href="/admin/upload.html">🎙️ Upload Audio</a>
    <a href="/admin/dashboard.html" class="active">📋 Dashboard</a>
  </div>
</div>

<div class="stats-grid" id="stats">
  <div class="loading"><span class="spinner"></span> Loading stats...</div>
</div>

<div class="table-container">
  <div class="table-header">
    <h2>All Confessions</h2>
    <div class="filter-btns">
      <button class="filter-btn active" onclick="filterConfessions('all')">All</button>
      <button class="filter-btn" onclick="filterConfessions('visible')">Visible</button>
      <button class="filter-btn" onclick="filterConfessions('hidden')">Hidden</button>
    </div>
  </div>
  <div id="confessions-list">
    <div class="loading"><span class="spinner"></span> Loading confessions...</div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="confirm-modal" id="confirm-modal">
  <div class="modal-content">
    <h3 id="modal-title">Are you sure?</h3>
    <p id="modal-text">This action cannot be undone.</p>
    <div class="modal-btns">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="confirm" id="modal-confirm" onclick="confirmAction()">Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" style="display:none;"></div>

<script>
let allConfessions = [];
let currentFilter = 'all';
let // action completed

async function apiGet(endpoint) {
  const res = await fetch(endpoint, {
    headers: { 'Authorization': 'Bearer funguka-admin-2024' }
  });
  if (!res.ok) throw new Error('API error');
  return res.json();
}

async function apiDelete(endpoint) {
  const res = await fetch(endpoint, {
    method: 'DELETE',
    headers: { 'Authorization': 'Bearer funguka-admin-2024' }
  });
  if (!res.ok) throw new Error('Delete failed');
  return res.json();
}

async function apiPost(endpoint) {
  const res = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Authorization': 'Bearer funguka-admin-2024', 'Content-Type': 'application/json' }
  });
  if (!res.ok) throw new Error('Action failed');
  return res.json();
}

async function loadStats() {
  try {
    const stats = await apiGet('/api/admin/stats');
    document.getElementById('stats').innerHTML = `
      <div class="stat-card">
        <div class="number">${stats.totalConfessions}</div>
        <div class="label">Total Confessions</div>
      </div>
      <div class="stat-card">
        <div class="number">${stats.flaggedConfessions}</div>
        <div class="label">Hidden / Flagged</div>
      </div>
      <div class="stat-card">
        <div class="number">${formatNum(stats.totalPlays)}</div>
        <div class="label">Total Plays</div>
      </div>
      <div class="stat-card">
        <div class="number">${formatNum(stats.totalReactions)}</div>
        <div class="label">Total Reactions</div>
      </div>
      <div class="stat-card">
        <div class="number">${stats.uniqueSessions}</div>
        <div class="label">Unique Users</div>
      </div>
    `;
  } catch (err) {
    document.getElementById('stats').innerHTML = '<div class="loading">Failed to load stats</div>';
  }
}

async function loadConfessions() {
  try {
    allConfessions = await apiGet('/api/admin/confessions');
    renderConfessions();
  } catch (err) {
    document.getElementById('confessions-list').innerHTML = '<div class="loading">Failed to load confessions</div>';
  }
}

function filterConfessions(filter) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  renderConfessions();
}

function renderConfessions() {
  let filtered = allConfessions;
  if (currentFilter === 'visible') filtered = allConfessions.filter(c => !c.isflagged);
  if (currentFilter === 'hidden') filtered = allConfessions.filter(c => c.isflagged);

  if (filtered.length === 0) {
    document.getElementById('confessions-list').innerHTML = `
      <div class="empty-state">
        <h4>No confessions found</h4>
        <p>${currentFilter === 'hidden' ? 'No hidden confessions.' : 'No confessions yet.'}</p>
      </div>
    `;
    return;
  }

  const catColors = {
    heartbreak: 'heartbreak',
    crime: 'crime',
    dark: 'dark',
    regret: 'regret',
    wild: 'wild'
  };

  document.getElementById('confessions-list').innerHTML = filtered.map(c => `
    <div class="confession-row ${c.isflagged ? 'hidden' : ''}">
      <div class="id">#${c.id}</div>
      <div class="title">
        ${escapeHtml(c.title)}
        ${c.isflagged ? '<span class="badge hidden">Hidden</span>' : ''}
        ${c.flagreason && !c.isflagged ? '<span class="badge flagged">Flagged</span>' : ''}
        <div class="preview">${escapeHtml(c.preview)}</div>
      </div>
      <div class="cat ${catColors[c.category] || ''}">${c.catlabel}</div>
      <div class="stats">▶ ${formatNum(c.plays)}<br>♡ ${formatNum(c.reactions)}</div>
      <div class="audio ${c.audiourl ? 'has' : 'none'}">${c.audiourl ? '🎙️ Yes' : '—'}</div>
      <div class="actions">
        <button class="btn-icon ${c.isflagged ? 'show' : 'hide'}" 
                onclick="toggleConfession(${c.id}, ${c.isflagged})" 
                title="${c.isflagged ? 'Show' : 'Hide'}">
          ${c.isflagged ? '👁️' : '🙈'}
        </button>
        <button class="btn-icon delete" onclick="deleteConfession(${c.id})" title="Delete">
          🗑️
        </button>
      </div>
    </div>
  `).join('');
}

function toggleConfession(id, isHidden) {
  pendingAction = { type: 'toggle', id };
  document.getElementById('modal-title').textContent = isHidden ? 'Show this confession?' : 'Hide this confession?';
  document.getElementById('modal-text').textContent = isHidden 
    ? 'This will make the confession visible to all users.' 
    : 'This will hide the confession from public view. You can unhide it later.';
  document.getElementById('modal-confirm').className = 'confirm';
  document.getElementById('modal-confirm').textContent = isHidden ? 'Show' : 'Hide';
  document.getElementById('confirm-modal').classList.add('show');
}

function deleteConfession(id) {
  pendingAction = { type: 'delete', id };
  document.getElementById('modal-title').textContent = 'Delete this confession?';
  document.getElementById('modal-text').textContent = 'This will permanently delete the confession and its audio file. This cannot be undone.';
  document.getElementById('modal-confirm').className = 'confirm delete';
  document.getElementById('modal-confirm').textContent = 'Delete';
  document.getElementById('confirm-modal').classList.add('show');
}

async function confirmAction() {
  const action = pendingAction;
  closeModal();
  if (!action) return;

  try {
    if (action.type === 'delete') {
      await apiDelete(`/api/admin/confessions/${action.id}`);
      showToast('Confession deleted', 'success');
    } else if (action.type === 'toggle') {
      const result = await apiPost(`/api/admin/confessions/${action.id}/toggle`);
      showToast(result.message, 'success');
    }
    loadConfessions();
    loadStats();
  } catch (err) {
    showToast(err.message || 'Action failed', 'error');
  }
  // action completed
}

function closeModal() {
  document.getElementById('confirm-modal').classList.remove('show');
  // action completed
}

function formatNum(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'K';
  return n.toString();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showToast(message, type) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast ' + type;
  toast.style.display = 'block';
  setTimeout(() => toast.style.display = 'none', 3000);
}

// Close modal on backdrop click
document.getElementById('confirm-modal').addEventListener('click', (e) => {
  if (e.target.id === 'confirm-modal') closeModal();
});

loadStats();
loadConfessions();
</script>
</body>
</html>
